name: 'DevSecOps Container Vulnerability Triage'
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install trivy -y

      - name: Build demo Docker image
        run: docker build -t demo-vulnerable-app:test -f docker/Dockerfile.demo .

      - name: Run Trivy scan
        run: trivy image --format json --output trivy-results.json --severity HIGH,CRITICAL demo-vulnerable-app:test
        continue-on-error: true

      - name: Run triage pipeline
        run: python -m src.main --trivy-json trivy-results.json
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: false

      - name: Upload trivy-results.json
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
